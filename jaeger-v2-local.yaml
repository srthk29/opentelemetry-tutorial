# ==============================================================================
# Jaeger v2.23+ Configuration for Local Deployment
# Based on the OpenTelemetry Collector Architecture
# ==============================================================================

service:
  extensions:
    - jaeger_storage
    - jaeger_query
    - healthcheckv2

  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [jaeger_storage_exporter]

    # Metrics pipeline: Enables MetricsService on OTLP receiver (port 4317)
    # This prevents 'Unimplemented unknown service MetricsService' errors from clients!
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [nop]

  # ----------------------------------------------------------------------------
  # Telemetry: Controls Jaeger's own internal Prometheus metrics & logging
  # ----------------------------------------------------------------------------
  telemetry:
    logs:
      level: info       # Options: debug, info, warn, error
      encoding: console # Options: console (human-readable) or json (production)

    metrics:
      level: normal     # Options: none (disabled), basic, normal, detailed
      readers:
        # Pull-based Prometheus scraper endpoint (Jaeger's own internal metrics)
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888 # Scrape endpoint: http://localhost:8888/metrics
                # To disable Prometheus metrics: set 'level: none' and 'readers: []'

# ------------------------------------------------------------------------------
# Extensions: Storage backends, Query Web UI, and Health Checks
# ------------------------------------------------------------------------------
extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: "0.0.0.0:13133"

  # Define storage backends (memory, badger, elasticsearch, clickhouse, etc.)
  jaeger_storage:
    backends:
      local_memory:
        memory:
          max_traces: 50000 # Retain last 50,000 traces in RAM

  # Exposes the Web UI and Query API
  jaeger_query:
    storage:
      traces: local_memory # References backend defined above
    http:
      endpoint: "0.0.0.0:16686" # Web UI: http://localhost:16686
    grpc:
      endpoint: "0.0.0.0:16685" # gRPC Query Service

# ------------------------------------------------------------------------------
# Receivers: How Jaeger accepts traces from SDKs and OTel Collectors
# ------------------------------------------------------------------------------
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317" # Standard OTLP gRPC receiver
      http:
        endpoint: "0.0.0.0:4318" # Standard OTLP HTTP receiver

# ------------------------------------------------------------------------------
# Processors: Memory protection and pipeline throughput batching
# ------------------------------------------------------------------------------
processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

  batch:
    timeout: 1s
    send_batch_size: 256

# ------------------------------------------------------------------------------
# Exporters: Connects the trace pipeline to the storage backend
# ------------------------------------------------------------------------------
exporters:
  jaeger_storage_exporter:
    trace_storage: local_memory # References the backend defined in jaeger_storage

  # Silent discard for incoming metrics (prevents OTLP MetricsService gRPC errors)
  # You can also use 'debug' (to print metrics) or 'prometheus' (to expose :8889)
  nop: {}
