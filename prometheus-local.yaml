# Prometheus configuration for Native macOS Local Execution (Outside Docker)
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # 1. Pipeline metrics & SpanMetrics (emitted by Jaeger v2 or OTel Collector on :8889)
  - job_name: "pipeline-metrics"
    static_configs:
      - targets: ["localhost:8889"]

  # 2. Jaeger v2 internal operational telemetry (:8888)
  - job_name: "jaeger-internal"
    static_configs:
      - targets: ["localhost:8888"]
